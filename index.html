<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CreatorOS turns your long-form content into platform-ready posts for every channel — automatically, in your voice, scheduled at the perfect time." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>CreatorOS — One Video. 30 Posts. Zero Effort.</title>
  </head>
  <body>
    <!-- Prevent flash of wrong theme — runs before React mounts -->
    <script>
      try {
        const t = localStorage.getItem('creatoros-theme') ?? 'dark';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (_) { document.documentElement.classList.add('dark'); }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
